<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Science Test</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mu:#6b7090;--pr:#4b5bd6;--ok:#1f9d55;--okb:#dff5e8;--no:#d63b3b;--nob:#fde4e4;--bd:#dfe2f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14162a;--card:#22254a;--tx:#f1f2fb;--mu:#a3a8cf;--pr:#7d8cff;--ok:#4cd788;--okb:#1d4a35;--no:#ff7a7a;--nob:#552a33;--bd:#343863}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:auto;padding:14px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:18px;margin:4px 0 12px}
.btn{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:8px 0;font:inherit;cursor:pointer}
.btn small{color:var(--mu);float:right}
.pri{background:var(--pr);color:#fff;border:0;text-align:center}
.row{display:flex;gap:8px}.row .btn{text-align:center}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.opt.sel{border-color:var(--pr);border-width:2px}.opt.ok{background:var(--okb);border:2px solid var(--ok)}.opt.no{background:var(--nob);border:2px solid var(--no)}
.mu{color:var(--mu);font-size:14px}.sol{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px;font-size:15px}
.fb{border-radius:10px;padding:10px;margin-top:6px;font-weight:600}.fb.g{background:var(--okb);color:var(--ok)}.fb.r{background:var(--nob);color:var(--no)}
textarea,input[type=text]{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:150px;font:13px monospace}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.star{cursor:pointer;font-size:24px;background:none;border:0;color:var(--pr)}
.tm{font-weight:700;font-size:18px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
.lg{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.on{border:2px solid var(--pr)}.q b{white-space:pre-line;font-weight:600}.lt{display:flex;justify-content:flex-end;gap:6px;margin:8px 0 0}.lt button{padding:3px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}.lt button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.credit{text-align:center;margin:40px 0 10px;color:var(--mu);font-size:14px}
</style></head><body><div id="app"></div>
<script>
const SEED=[
{topic:"Five Laws",q:"Who propounded the Five Laws of Library Science?",o:["Melvil Dewey","S. R. Ranganathan","Cutter","Bliss"],a:1,sol:"S. R. Ranganathan gave the Five Laws in 1931.",qh:"पुस्तकालय विज्ञान के पाँच नियम किसने प्रतिपादित किए?",oh:["मेलविल डेवी","एस. आर. रंगनाथन","कटर","ब्लिस"],solh:"एस. आर. रंगनाथन ने 1931 में पाँच नियम दिए।"},
{topic:"Five Laws",q:"“Books are for use” is the ___ law.",o:["First","Second","Third","Fifth"],a:0,sol:"First Law: Books are for use.",qh:"“पुस्तकें उपयोग के लिए हैं” ___ नियम है।",oh:["पहला","दूसरा","तीसरा","पाँचवाँ"],solh:"प्रथम नियम: पुस्तकें उपयोग के लिए हैं।"},
{topic:"Five Laws",q:"“Library is a growing organism” is the ___ law.",o:["Second","Third","Fourth","Fifth"],a:3,sol:"Fifth Law: Library is a growing organism.",qh:"“पुस्तकालय एक वर्धनशील जीव है” ___ नियम है।",oh:["दूसरा","तीसरा","चौथा","पाँचवाँ"],solh:"पाँचवाँ नियम: पुस्तकालय एक वर्धनशील जीव है।"},
{topic:"Classification",q:"DDC was first published in the year:",o:["1851","1876","1933","1901"],a:1,sol:"Melvil Dewey published DDC in 1876.",qh:"DDC पहली बार किस वर्ष प्रकाशित हुआ?",oh:["1851","1876","1933","1901"],solh:"मेलविल डेवी ने 1876 में DDC प्रकाशित किया।"},
{topic:"Classification",q:"Colon Classification was developed by:",o:["Dewey","Cutter","Ranganathan","Bliss"],a:2,sol:"Ranganathan developed Colon Classification (1933).",qh:"कोलन वर्गीकरण किसने विकसित किया?",oh:["डेवी","कटर","रंगनाथन","ब्लिस"],solh:"रंगनाथन ने कोलन वर्गीकरण (1933) विकसित किया।"},
{topic:"Classification",q:"DDC divides knowledge into how many main classes?",o:["5","10","26","100"],a:1,sol:"DDC has 10 main classes (000–900).",qh:"DDC ज्ञान को कितने मुख्य वर्गों में बाँटता है?",oh:["5","10","26","100"],solh:"DDC में 10 मुख्य वर्ग (000–900) हैं।"},
{topic:"Cataloguing",q:"AACR stands for:",o:["Anglo-American Cataloguing Rules","American Association of Cataloguing Rules","Anglo-Asian Cataloguing Rules","None"],a:0,sol:"Anglo-American Cataloguing Rules.",qh:"AACR का पूर्ण रूप है:",oh:["Anglo-American Cataloguing Rules","American Association of Cataloguing Rules","Anglo-Asian Cataloguing Rules","इनमें से कोई नहीं"],solh:"एंग्लो-अमेरिकन कैटलॉगिंग रूल्स।"},
{topic:"Cataloguing",q:"The Dictionary Catalogue was devised by:",o:["Cutter","Ranganathan","Panizzi","Jewett"],a:0,sol:"C. A. Cutter popularised the dictionary catalogue.",qh:"शब्दकोश सूची (Dictionary Catalogue) किसने तैयार की?",oh:["कटर","रंगनाथन","पैनिज़ी","ज्यूएट"],solh:"सी. ए. कटर ने इसे लोकप्रिय बनाया।"},
{topic:"Library Legislation",q:"The first Public Library Act in India was passed in which state?",o:["Madras","Bengal","Maharashtra","Delhi"],a:0,sol:"Madras Public Libraries Act, 1948.",qh:"भारत में पहला सार्वजनिक पुस्तकालय अधिनियम किस राज्य में पारित हुआ?",oh:["मद्रास","बंगाल","महाराष्ट्र","दिल्ली"],solh:"मद्रास सार्वजनिक पुस्तकालय अधिनियम, 1948।"},
{topic:"Reference Service",q:"Ready Reference Service answers:",o:["Short factual queries","Long research queries","Only loans","Only renewals"],a:0,sol:"It gives quick, short factual answers.",qh:"रेडी रेफरेंस सेवा में क्या उत्तर दिए जाते हैं?",oh:["संक्षिप्त तथ्यात्मक प्रश्न","लंबे शोध प्रश्न","केवल निर्गमन","केवल नवीनीकरण"],solh:"इसमें त्वरित, संक्षिप्त तथ्यात्मक उत्तर दिए जाते हैं।"}];
const D={en:{app:"Library Science Test",hello:"Hello",qs:"questions · works offline",series:"Test Series (20 Qs each)",topics:"Topic-wise Tests",bm:"Bookmarks",sc:"My Scores",add:"Add / Import Questions",set:"Settings",back:"← Back",test:"Test",best:"Best",q:"Qs",right:"Correct!",wrong:"Wrong!",ans:"Answer",prev:"◀ Prev",next:"Next ▶",submit:"Submit",subnow:"Submit test now",conf:"Submit test now?",res:"Result",time:"Time",corr:"Correct",wr:"Wrong",sk:"Skipped",saved:"Wrong questions were saved to Bookmarks.",rev:"Review Answers & Solutions",again:"Try again",home:"Home",nobm:"No bookmarks yet. Wrong answers are saved here automatically, or tap ☆ on any question.",nosc:"No tests taken yet.",clr:"Clear scores",wel:"Welcome! Enter your name",nm:"Your name",go:"Start",lang:"Language",snd:"Sound",on:"🔊 On",mute:"🔇 Mute",vol:"Volume",imph:"Paste JSON or CSV below (or choose a file), then tap Import. Duplicates are skipped.",imp:"Import",bk:"⬇️ Copy backup (JSON) to box",rst:"Reset to sample questions",save:"Save",fnt:"Font style",fsz:"Font size"},
hi:{app:"लाइब्रेरी साइंस टेस्ट",hello:"नमस्ते",qs:"प्रश्न · ऑफ़लाइन चलता है",series:"टेस्ट सीरीज़ (20-20 प्रश्न)",topics:"टॉपिक-वाइज़ टेस्ट",bm:"बुकमार्क",sc:"मेरे स्कोर",add:"प्रश्न जोड़ें / इम्पोर्ट करें",set:"सेटिंग",back:"← वापस",test:"टेस्ट",best:"सर्वश्रेष्ठ",q:"प्रश्न",right:"सही उत्तर!",wrong:"गलत उत्तर!",ans:"उत्तर",prev:"◀ पिछला",next:"अगला ▶",submit:"सबमिट",subnow:"अभी टेस्ट सबमिट करें",conf:"टेस्ट सबमिट करें?",res:"परिणाम",time:"समय",corr:"सही",wr:"गलत",sk:"छोड़े",saved:"गलत प्रश्न बुकमार्क में सेव हो गए हैं।",rev:"उत्तर और समाधान देखें",again:"फिर से दें",home:"होम",nobm:"अभी कोई बुकमार्क नहीं। गलत प्रश्न अपने आप यहाँ सेव होते हैं, या किसी प्रश्न पर ☆ दबाएँ।",nosc:"अभी कोई टेस्ट नहीं दिया।",clr:"स्कोर मिटाएँ",wel:"स्वागत है! अपना नाम लिखें",nm:"आपका नाम",go:"शुरू करें",lang:"भाषा",snd:"आवाज़",on:"🔊 चालू",mute:"🔇 म्यूट",vol:"वॉल्यूम",imph:"नीचे JSON या CSV पेस्ट करें (या फ़ाइल चुनें), फिर Import दबाएँ। डुप्लीकेट छोड़ दिए जाएँगे।",imp:"Import",bk:"⬇️ बैकअप (JSON) बॉक्स में कॉपी करें",rst:"सैंपल प्रश्नों पर रीसेट करें",save:"सेव",fnt:"फ़ॉन्ट स्टाइल",fsz:"फ़ॉन्ट साइज़"}};
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=Object.assign({lang:"en",sound:true,vol:70,name:"",font:0,fs:16},ld("lq_set",{}));
const FONTS=[["Default","system-ui,sans-serif"],["Serif","Georgia,'Times New Roman',serif"],["Verdana","Verdana,Geneva,sans-serif"],["Trebuchet","'Trebuchet MS',Tahoma,sans-serif"],["Typewriter","'Courier New',monospace"],["Handwriting","'Comic Sans MS','Segoe Print',cursive"]];
const applyFont=()=>{const f=FONTS[S.font]||FONTS[0];document.body.style.fontFamily=f[1];document.body.style.fontSize=S.fs+"px"};
let DB=ld("lq_db",SEED),BM=ld("lq_bm",[]),HS=ld("lq_hs",[]),T=null,TI=null;
const t=k=>D[S.lang][k],id=x=>x.q.toLowerCase().replace(/\s+/g,"").slice(0,80);
DB.forEach(x=>{const s=SEED.find(z=>id(z)===id(x));if(s&&!x.qh)Object.assign(x,{qh:s.qh,oh:s.oh,solh:s.solh})});
const hi=x=>S.lang==="hi"&&x.qh,QT=x=>hi(x)?x.qh:x.q,OT=x=>hi(x)&&x.oh?x.oh:x.o,ST=x=>hi(x)&&x.solh?x.solh:(x.sol||"—");
const chunks=a=>{const r=[];for(let i=0;i<a.length;i+=20)r.push(a.slice(i,i+20));return r};
const topics=()=>[...new Set(DB.map(x=>x.topic))];
const app=h=>{$("#app").innerHTML=h;window.scrollTo(0,0)};
const back=(to="home()")=>`<button class="btn" style="width:auto;display:inline-block;padding:8px 14px" onclick="${to}">${t("back")}</button>`;
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const stopT=()=>{clearInterval(TI);TI=null};
/* sound */
let AC=null;
function beep(ok){if(!S.sound||!S.vol)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const v=S.vol/100*0.4,n=AC.currentTime;
const tone=(f,st,d,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n+st);g.gain.setValueAtTime(v,n+st);g.gain.exponentialRampToValueAtTime(0.001,n+st+d);o.connect(g);g.connect(AC.destination);o.start(n+st);o.stop(n+st+d)};
if(ok){tone(660,0,.15,"sine");tone(880,.12,.25,"sine")}else{tone(220,0,.18,"sawtooth");tone(140,.16,.35,"sawtooth")}}catch(e){}}

function welcome(){app(`<h1>📚 ${t("app")}</h1><div class="q"><p><b>${t("wel")}</b></p><input type="text" id="nm" placeholder="${t("nm")}"><div class="row" style="margin-top:10px"><button class="btn ${S.lang==="en"?"on":""}" onclick="setLang('en',1)">English</button><button class="btn ${S.lang==="hi"?"on":""}" onclick="setLang('hi',1)">हिन्दी</button></div><button class="btn pri" onclick="saveName(1)">${t("go")}</button></div>`)}
function saveName(w){const v=($("#nm").value||"").trim();if(!v&&w){$("#nm").focus();return}S.name=v;sv("lq_set",S);home()}
function setLang(l,w){S.lang=l;sv("lq_set",S);w?welcome():settings()}

function home(){stopT();if(!S.name){welcome();return}app(`<div class="top"><h1>📚 ${t("app")}</h1><button class="star" onclick="settings()">⚙️</button></div>
<p class="mu">${t("hello")}, <b>${esc(S.name)}</b> · ${DB.length} ${t("qs")}</p>
<button class="btn" onclick="series()">📝 ${t("series")}<small>${chunks(DB).length}</small></button>
<button class="btn" onclick="topicList()">🗂️ ${t("topics")}<small>${topics().length}</small></button>
<button class="btn" onclick="startBM()">🔖 ${t("bm")}<small>${BM.length}</small></button>
<button class="btn" onclick="hist()">📊 ${t("sc")}<small>${HS.length}</small></button>
<button class="btn" onclick="manage()">➕ ${t("add")}</button>`)}

function settings(){app(back()+`<h2>⚙️ ${t("set")}</h2>
<div class="q"><b>${t("nm")}</b><input type="text" id="nm" value="${esc(S.name)}" style="margin:8px 0"><button class="btn pri" onclick="saveName(0)">${t("save")}</button></div>
<div class="q"><b>${t("lang")}</b><div class="row"><button class="btn ${S.lang==="en"?"on":""}" onclick="setLang('en')">English</button><button class="btn ${S.lang==="hi"?"on":""}" onclick="setLang('hi')">हिन्दी</button></div></div>
<div class="q"><b>${t("snd")}</b><div class="row"><button class="btn ${S.sound?"on":""}" onclick="S.sound=true;sv('lq_set',S);beep(1);settings()">${t("on")}</button><button class="btn ${!S.sound?"on":""}" onclick="S.sound=false;sv('lq_set',S);settings()">${t("mute")}</button></div>
<p class="mu" style="margin:6px 0 0">${t("vol")}: <span id="vl">${S.vol}</span>%</p><input type="range" min="0" max="100" value="${S.vol}" style="width:100%" oninput="S.vol=+this.value;$('#vl').textContent=S.vol" onchange="sv('lq_set',S);beep(1)"></div>
<div class="q"><b>${t("fnt")}</b><div class="row" style="flex-wrap:wrap">${FONTS.map((f,i)=>`<button class="btn ${S.font===i?"on":""}" style="font-family:${f[1]};flex:1 1 40%" onclick="S.font=${i};sv('lq_set',S);applyFont();settings()">${f[0]}</button>`).join("")}</div><p class="mu" style="margin:6px 0 0">${t("fsz")}: <span id="fz">${S.fs}</span>px</p><input type="range" min="13" max="26" value="${S.fs}" style="width:100%" oninput="S.fs=+this.value;$('#fz').textContent=S.fs;applyFont()" onchange="sv('lq_set',S)"><div class="sol">Aa — The quick brown fox · पुस्तकालय विज्ञान</div></div>
<div class="credit"><b style="color:var(--tx)">Suresh Vyas</b><br>Bikaner, Rajasthan</div>`)}

function series(){app(back()+`<h2>${t("series")}</h2>`+chunks(DB).map((c,i)=>{const h=HS.find(x=>x.t==="Test "+(i+1));return `<button class="btn" onclick="start(chunks(DB)[${i}],'Test ${i+1}')">${t("test")} ${i+1}<small>${h?t("best")+" "+h.best+"/"+h.n:c.length+" "+t("q")}</small></button>`}).join(""))}
function topicList(){app(back()+`<h2>${t("topics")}</h2>`+topics().map((p,i)=>`<button class="btn" onclick="topicTests(${i})">${esc(p)}<small>${DB.filter(x=>x.topic===p).length} ${t("q")}</small></button>`).join(""))}
function topicTests(i){const p=topics()[i],cs=chunks(DB.filter(x=>x.topic===p));
app(back("topicList()")+`<h2>${esc(p)}</h2>`+cs.map((c,j)=>{const nm=p+" – Test "+(j+1);const h=HS.find(x=>x.t===nm);return `<button class="btn" onclick="start(chunks(DB.filter(x=>x.topic===topics()[${i}]))[${j}],topics()[${i}]+' – Test ${j+1}')">${t("test")} ${j+1}<small>${h?t("best")+" "+h.best+"/"+h.n:c.length+" "+t("q")}</small></button>`}).join(""))}
function startBM(){const l=DB.filter(x=>BM.includes(id(x)));if(!l.length){app(back()+`<h2>${t("bm")}</h2><p class="mu">${t("nobm")}</p>`);return}start(l,"Bookmarks")}

function start(list,title){stopT();T={list,title,ans:Array(list.length).fill(-1),i:0,done:false,t0:Date.now()};TI=setInterval(()=>{const e=$("#tm");if(e&&T&&!T.done)e.textContent="⏱ "+fmt(Math.floor((Date.now()-T.t0)/1000))},1000);ques()}
function ques(){const x=T.list[T.i],n=T.list.length,b=BM.includes(id(x)),a=T.ans[T.i],lk=a>=0;
app(`<div class="top"><span class="tm" id="tm">⏱ ${fmt(Math.floor((Date.now()-T.t0)/1000))}</span><span class="mu">${esc(T.title)} · ${T.i+1}/${n}</span></div>
<div class="bar"><i style="width:${(T.i+1)/n*100}%"></i></div>
${lt()}<div class="q" style="margin-top:4px"><div class="top"><b>Q${T.i+1}. ${esc(QT(x))}</b><button class="star" onclick="tog(${T.i})">${b?"★":"☆"}</button></div>
${OT(x).map((o,k)=>`<button class="btn opt ${lk?(k===x.a?"ok":a===k?"no":""):""}" onclick="pick(${k})">${"ABCD"[k]}. ${esc(o)} ${lk?(k===x.a?"✅":a===k?"❌":""):""}</button>`).join("")}
${lk?`<div class="fb ${a===x.a?"g":"r"}">${a===x.a?"✅ "+t("right"):"❌ "+t("wrong")}</div><div class="sol">💡 ${esc(ST(x))}</div>`:""}</div>
<div class="row"><button class="btn" onclick="mv(-1)">${t("prev")}</button>${T.i<n-1?`<button class="btn pri" onclick="mv(1)">${t("next")}</button>`:`<button class="btn pri" onclick="submit()">${t("submit")}</button>`}</div>
<button class="btn" onclick="if(confirm('${t("conf")}'))submit()">${t("subnow")}</button>`)}
const lt=()=>`<div class="lt"><button class="${S.lang==="hi"?"on":""}" onclick="setQL('hi')">हिन्दी</button><button class="${S.lang==="en"?"on":""}" onclick="setQL('en')">English</button></div>`;
function setQL(l){S.lang=l;sv("lq_set",S);T&&T.done?review():ques()}
function pick(k){if(T.ans[T.i]>=0)return;T.ans[T.i]=k;beep(k===T.list[T.i].a);ques()}
function mv(d){T.i+=d;if(T.i<0)T.i=0;ques()}
function tog(i){const k=id(T.list[i]);BM=BM.includes(k)?BM.filter(z=>z!==k):[...BM,k];sv("lq_bm",BM);T.done?review():ques()}

function donut(c,w,s,n){const C=2*Math.PI*40;let off=0;const seg=(v,col)=>{const l=v/n*C;const e=`<circle r="40" cx="50" cy="50" fill="none" stroke="${col}" stroke-width="14" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;off+=l;return e};
return `<svg viewBox="0 0 100 100" width="210" style="display:block;margin:auto;color:var(--tx)"><circle r="40" cx="50" cy="50" fill="none" stroke="#9aa0c0" stroke-opacity=".25" stroke-width="14"/>${seg(c,"#1f9d55")}${seg(w,"#d63b3b")}${seg(s,"#9aa0c0")}<text x="50" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${Math.round(c/n*100)}%</text><text x="50" y="63" text-anchor="middle" font-size="7" fill="currentColor">${c}/${n}</text></svg>`}

function submit(){stopT();let s=0;T.list.forEach((x,i)=>{const k=id(x);if(T.ans[i]===x.a)s++;else if(T.ans[i]>=0&&T.title!=="Bookmarks"&&!BM.includes(k))BM.push(k)});sv("lq_bm",BM);
T.score=s;T.done=true;T.secs=Math.floor((Date.now()-T.t0)/1000);const n=T.list.length;let h=HS.find(z=>z.t===T.title);
if(h){h.best=Math.max(h.best,s);h.last=s;h.n=n}else HS.push({t:T.title,best:s,last:s,n});sv("lq_hs",HS);
const sk=T.ans.filter(a=>a<0).length,wr=n-s-sk;
app(`<h2>${t("res")} · ${esc(S.name)}</h2><div class="q">${donut(s,wr,sk,n)}
<div class="lg"><span>🟢 ${t("corr")} ${s}</span><span>🔴 ${t("wr")} ${wr}</span><span>⚪ ${t("sk")} ${sk}</span></div>
<p style="text-align:center;margin:10px 0 0"><b>⏱ ${t("time")}: ${fmt(T.secs)}</b></p><p class="mu" style="text-align:center">${t("saved")}</p></div>
<button class="btn pri" onclick="review()">${t("rev")}</button><button class="btn" onclick="start(T.list,T.title)">${t("again")}</button><button class="btn" onclick="home()">${t("home")}</button>`)}

function review(){app(`<h2>${t("rev")}</h2>`+lt()+T.list.map((x,i)=>`<div class="q"><div class="top"><b>Q${i+1}. ${esc(QT(x))}</b><button class="star" onclick="tog(${i})">${BM.includes(id(x))?"★":"☆"}</button></div>
${OT(x).map((o,k)=>`<div class="btn opt ${k===x.a?"ok":T.ans[i]===k?"no":""}">${"ABCD"[k]}. ${esc(o)} ${k===x.a?"✅":T.ans[i]===k?"❌":""}</div>`).join("")}
<div class="sol">💡 ${esc(ST(x))}</div></div>`).join("")+`<button class="btn" onclick="home()">${t("home")}</button>`)}

function hist(){app(back()+`<h2>${t("sc")}</h2>`+(HS.length?HS.map(h=>`<div class="btn">${esc(h.t)}<small>${h.last}/${h.n} · ${t("best")} ${h.best}</small></div>`).join("")+`<button class="btn" onclick="HS=[];sv('lq_hs',HS);hist()">${t("clr")}</button>`:`<p class="mu">${t("nosc")}</p>`))}

function manage(){app(back()+`<h2>${t("add")}</h2><p class="mu">${t("imph")}</p>
<textarea id="ta" placeholder='[{"topic":"Five Laws","q":"Question?","o":["A","B","C","D"],"a":1,"sol":"Explanation","qh":"हिन्दी प्रश्न","oh":["क","ख","ग","घ"],"solh":"हिन्दी समाधान"}]'></textarea>
<input type="file" id="fl" accept=".json,.csv,.txt" onchange="fromFile(this)" style="margin:8px 0;max-width:100%">
<button class="btn pri" onclick="doImport()">${t("imp")}</button><button class="btn" onclick="$('#ta').value=JSON.stringify(DB,null,1)">${t("bk")}</button>
<button class="btn" onclick="if(confirm('?')){DB=SEED;sv('lq_db',DB);BM=[];sv('lq_bm',BM);home()}">${t("rst")}</button><p class="mu" id="msg"></p>`)}
function fromFile(f){const r=new FileReader();r.onload=()=>{$("#ta").value=r.result};r.readAsText(f.files[0])}
function csv(s){const R=[];let r=[],c="",q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;r.push(c);c="";if(r.some(z=>z.trim()))R.push(r);r=[]}else c+=ch}r.push(c);if(r.some(z=>z.trim()))R.push(r);return R}
function doImport(){const s=$("#ta").value.trim();let L=[];try{
if(s[0]==="["||s[0]==="{"){L=JSON.parse(s);if(!Array.isArray(L))L=[L]}
else{let R=csv(s);if(R[0]&&/topic/i.test(R[0][0]))R.shift();L=R.map(r=>{const a=r[6].trim().toUpperCase(),x={topic:r[0].trim(),q:r[1].trim(),o:[r[2],r[3],r[4],r[5]].map(z=>z.trim()),a:"ABCD".includes(a)?"ABCD".indexOf(a):(+a)-1,sol:(r[7]||"").trim()};if(r[8]&&r[8].trim()){x.qh=r[8].trim();x.oh=[r[9],r[10],r[11],r[12]].map(z=>(z||"").trim());x.solh=(r[13]||"").trim()}return x})}
}catch(e){$("#msg").textContent="❌ "+e.message;return}
const have=new Set(DB.map(id));let add=0,bad=0;
L.forEach(x=>{if(!x||!x.q||!Array.isArray(x.o)||x.o.length!==4||!(x.a>=0&&x.a<=3)){bad++;return}x.topic=x.topic||"General";if(have.has(id(x)))return;have.add(id(x));DB.push(x);add++});
sv("lq_db",DB);$("#msg").textContent=`✅ ${add} added · ${bad} invalid · total ${DB.length}`}
applyFont();home();
</script></body></html>
